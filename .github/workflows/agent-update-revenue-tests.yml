name: Agent update revenue tests

on:
  push:
    branches:
      - agent/remove-base-revenue-route-registrar

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-base-revenue-route-registrar
          fetch-depth: 0
      - name: Remove obsolete registrar test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/test/revenue-reporting.test.js')
          text = path.read_text()
          text = text.replace(",\n  registerRevenueReportingRoutes\n", "\n")
          block = """\ntest('registers protected reporting pack and generic drilldown routes', () => {\n  const routes = [];\n  const app = {\n    get(path, options, handler) {\n      routes.push({ path, options, handler });\n    }\n  };\n  const requireAdmin = () => undefined;\n  registerRevenueReportingRoutes(app, {\n    postgres: {},\n    requireAdmin,\n    requireWorkspace: async () => ({ id: 'workspace-id' })\n  });\n  assert.deepEqual(routes.map((route) => route.path), [\n    '/api/v1/workspaces/:workspaceId/analytics/revenue',\n    '/api/v1/workspaces/:workspaceId/analytics/revenue/drilldowns/:reportKey'\n  ]);\n  assert.ok(routes.every((route) => route.options.preHandler === requireAdmin));\n});\n"""
          if text.count(block) != 1:
              raise SystemExit('Expected one obsolete registrar test block')
          path.write_text(text.replace(block, ''))
          Path('.github/workflows/agent-update-revenue-tests.yml').unlink()
          PY
      - name: Commit branch change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/test/revenue-reporting.test.js .github/workflows/agent-update-revenue-tests.yml
          git commit -m 'Remove obsolete base registrar test'
          git push origin HEAD:agent/remove-base-revenue-route-registrar
