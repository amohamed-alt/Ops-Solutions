name: Agent remove base revenue registration call

on:
  push:
    branches:
      - agent/remove-base-revenue-route-registrar

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-base-revenue-route-registrar
          fetch-depth: 0
      - name: Remove obsolete base registration dependency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/sync-operations-base.js')
          text = path.read_text()
          import_line = "import { registerRevenueReportingRoutes } from './revenue-reporting.js';\n"
          call_line = "  registerRevenueReportingRoutes(app, { postgres, requireAdmin, requireWorkspace });\n"
          if text.count(import_line) != 1 or text.count(call_line) != 1:
              raise SystemExit('Expected one legacy revenue import and registration call')
          path.write_text(text.replace(import_line, '').replace(call_line, ''))
          Path('.github/workflows/agent-remove-base-revenue-registration-call.yml').unlink()
          PY
      - name: Commit branch change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/sync-operations-base.js .github/workflows/agent-remove-base-revenue-registration-call.yml
          git commit -m 'Remove legacy revenue registration from sync base'
          git push origin HEAD:agent/remove-base-revenue-route-registrar
